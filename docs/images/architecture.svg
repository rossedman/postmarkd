<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" width="1040" height="330" role="img" aria-labelledby="t d">
  <title id="t">How a message flows through postmarkd</title>
  <desc id="d">HTTP clients (CLI, sendmail, Postmark SDKs, curl) reach the HTTP API, which authenticates them. SMTP clients reach the SMTP server, which converts MIME to Postmark JSON. Both paths are validated and get defaults, then go to Postmark either directly (sync) or through the async queue, via a pooled, rate-limited client with safe retries.</desc>
  <style>
    .bg { fill: #FBF8F2 } .box { fill: #FFFFFF; stroke: #D6CDBC; stroke-width: 1.5 }
    .core { fill: #FFFFFF; stroke: #E0492A; stroke-width: 2 }
    .region { fill: none; stroke: #E0492A; stroke-width: 1.5; stroke-dasharray: 6 6; opacity: .7 }
    .pm { fill: #16171D } .t.pmt { fill: #FBF8F2 }
    .t { fill: #16171D; font: 600 15px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif }
    .s { fill: #5D606B; font: 400 12.5px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif }
    .lbl { fill: #E0492A; font: 600 12px "JetBrains Mono", ui-monospace, Menlo, monospace; letter-spacing: 1.5px }
    .edge { fill: none; stroke: #5D606B; stroke-width: 1.6 } .hot { stroke: #E0492A; stroke-width: 2 }
    .dash { stroke-dasharray: 5 5 } .head { fill: #5D606B } .headhot { fill: #E0492A } .edge.hot { stroke: #E0492A }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0F1015 } .box, .core { fill: #181922 } .box { stroke: #343745 }
      .core, .region { stroke: #FF6B47 } .lbl { fill: #FF6B47 } .hot { stroke: #FF6B47 } .headhot { fill: #FF6B47 }
      .pm { fill: #EEEAE2 } .t.pmt { fill: #0F1015 } .t { fill: #EEEAE2 } .s { fill: #A2A3AE }
      .edge { stroke: #A2A3AE } .head { fill: #A2A3AE } .edge.hot { stroke: #FF6B47 }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="headhot" d="M0 0 10 5 0 10z"/></marker>
  </defs>
  <rect class="bg" width="1040" height="330" rx="16"/>

  <!-- postmarkd boundary -->
  <rect class="region" x="200" y="22" width="644" height="290" rx="18"/>
  <text class="lbl" x="222" y="46">POSTMARKD</text>

  <!-- clients -->
  <rect class="box" x="20" y="64" width="160" height="76" rx="12"/>
  <text class="t" x="36" y="92">HTTP clients</text>
  <text class="s" x="36" y="112">CLI · sendmail</text>
  <text class="s" x="36" y="128">Postmark SDKs · curl</text>

  <rect class="box" x="20" y="204" width="160" height="62" rx="12"/>
  <text class="t" x="36" y="231">SMTP clients</text>
  <text class="s" x="36" y="251">Rails · Django · Laravel</text>

  <!-- listeners -->
  <rect class="box" x="222" y="64" width="168" height="76" rx="12"/>
  <text class="t" x="238" y="92">HTTP API</text>
  <text class="s" x="238" y="112">unix socket or TCP</text>
  <text class="s" x="238" y="128">client tokens</text>

  <rect class="box" x="222" y="204" width="168" height="62" rx="12"/>
  <text class="t" x="238" y="231">SMTP server</text>
  <text class="s" x="238" y="251">MIME → Postmark JSON</text>

  <!-- validate -->
  <rect class="core" x="420" y="128" width="168" height="76" rx="12"/>
  <text class="t" x="436" y="156">Validate</text>
  <text class="s" x="436" y="176">apply From and stream</text>
  <text class="s" x="436" y="192">defaults</text>

  <!-- queue -->
  <rect class="box" x="644" y="226" width="180" height="62" rx="12"/>
  <text class="t" x="660" y="253">Async queue</text>
  <text class="s" x="660" y="273">bounded · worker pool</text>

  <!-- client -->
  <rect class="core" x="644" y="96" width="180" height="76" rx="12"/>
  <text class="t" x="660" y="124">Postmark client</text>
  <text class="s" x="660" y="144">pooled HTTPS connections</text>
  <text class="s" x="660" y="160">concurrency limit · retries</text>

  <!-- Postmark -->
  <rect class="pm" x="868" y="104" width="152" height="60" rx="14"/>
  <text class="t pmt" x="944" y="140" text-anchor="middle">Postmark</text>

  <!-- edges -->
  <path class="edge" d="M180 102H218" marker-end="url(#a)"/>
  <path class="edge" d="M180 235H218" marker-end="url(#a)"/>
  <path class="edge" d="M390 102H404Q410 102 410 108V150Q410 156 416 156H418" marker-end="url(#a)"/>
  <path class="edge" d="M390 235H404Q410 235 410 229V182Q410 176 416 176H418" marker-end="url(#a)"/>
  <path class="edge hot" d="M588 152H608Q614 152 614 146V140Q614 134 620 134H640" marker-end="url(#ah)"/>
  <text class="s" x="604" y="124">sync</text>
  <path class="edge dash" d="M588 186H608Q614 186 614 192V251Q614 257 620 257H640" marker-end="url(#a)"/>
  <text class="s" x="572" y="226">async</text>
  <path class="edge dash" d="M734 226V176" marker-end="url(#a)"/>
  <path class="edge hot" d="M824 134H864" marker-end="url(#ah)"/>
</svg>
