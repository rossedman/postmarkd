# postmarkd configuration — installed as /etc/postmarkd/postmarkd.conf
#
# KEY=VALUE format (compatible with systemd EnvironmentFile=). Any key can
# also be set as an environment variable, which takes precedence.
# See docs/configuration.md for details on every option.

# Where to listen: a TCP address or a unix socket ("unix:/path" or "/path").
# Ignored when started through postmarkd.socket.
POSTMARKD_LISTEN=unix:/run/postmarkd/postmarkd.sock
#POSTMARKD_LISTEN=127.0.0.1:8025
#POSTMARKD_SOCKET_MODE=0660

# Accept SMTP too (for apps that only speak SMTP). Same address forms.
# Port 25 needs postmarkd-smtp.socket (systemd binds it); 2525 works directly.
#POSTMARKD_SMTP_LISTEN=127.0.0.1:2525
#POSTMARKD_SMTP_HOSTNAME=

# Testing: accept mail but never send it. Captured mail is listed at
# GET /blackhole/messages. No server token needed.
#POSTMARKD_BLACKHOLE=false
#POSTMARKD_BLACKHOLE_KEEP=1000

# Postmark server token. Prefer the systemd credential (see postmarkd.service)
# or a file over putting the token here.
#POSTMARKD_SERVER_TOKEN=
#POSTMARKD_SERVER_TOKEN_FILE=/etc/postmarkd/server-token

# Defaults applied to messages that omit them.
#POSTMARKD_DEFAULT_FROM=noreply@example.com
#POSTMARKD_DEFAULT_MESSAGE_STREAM=outbound

# Require clients to authenticate (comma separated). Strongly recommended
# when listening on TCP.
#POSTMARKD_AUTH_TOKENS=
#POSTMARKD_AUTH_TOKENS_FILE=/etc/postmarkd/auth-tokens

# Throughput tuning.
#POSTMARKD_MAX_CONCURRENCY=128
#POSTMARKD_WORKERS=32
#POSTMARKD_QUEUE_SIZE=10000
#POSTMARKD_MAX_RETRIES=3
#POSTMARKD_UPSTREAM_TIMEOUT=30s
#POSTMARKD_MAX_BODY_BYTES=52428800
#POSTMARKD_SHUTDOWN_TIMEOUT=30s

# Logging: debug, info, warn, error / text, json
#POSTMARKD_LOG_LEVEL=info
#POSTMARKD_LOG_FORMAT=text
