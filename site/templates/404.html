{{define "page-404"}}{{template "head" .}}
<body class="notfound-page">
{{template "header" .}}
<main id="main" class="notfound">
  <div class="returned">{{template "mark"}}<span>Return to sender</span></div>
  <h1>Address unknown</h1>
  <p>This page doesn’t exist, or it moved. Try the docs or search.</p>
  <p class="cta-row"><a class="btn btn-primary" href="{{.Root}}docs/getting-started.html">Read the docs</a> <a class="btn" href="{{.Root}}index.html">Home</a></p>
</main>
{{template "footer" .}}
</body>
</html>
{{end}}
