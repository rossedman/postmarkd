name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What you'd like
      description: How you imagine it working. Config options, commands or API shapes are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
