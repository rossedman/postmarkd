version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      go:
        patterns: ["*"]
  # The docs site generator is its own module.
  - package-ecosystem: gomod
    directory: /site
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      site:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /assets/brand/src
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      brand:
        patterns: ["*"]
